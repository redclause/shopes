name: Cloudflare migration live HTTP smoke

on:
  push:
    branches: [migration/cloudflare-runtime-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redclause-preview-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect RedClause Worker routes without production cutover
        shell: bash
        run: |
          set -euo pipefail
          base="https://redclause-migration-preview.egreegregio.workers.dev"
          failures=0
          for route in "/" "/blog" "/music" "/sitemap.xml" "/robots.txt" "/treaty/RC-2026-000001?holder=Preview&matter=Testing" "/treaty/RC-2026-000001/opengraph-image" "/ogimage.png"; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sSL --max-time 25 -D "$headers" -o "$body" -w '%{http_code}' "$base$route" || echo 000)"
            type="$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' || true)"
            robots="$(grep -i '^x-robots-tag:' "$headers" | tail -1 | tr -d '\r' || true)"
            echo "$route -> HTTP $code, $type, $robots"
            if [[ "$code" != "200" ]]; then failures=$((failures+1)); fi
            if [[ "$route" == "/" || "$route" == "/blog" || "$route" == "/music" || "$route" == /treaty/RC-2026-000001\?* ]]; then
              if ! grep -qis 'noindex' <<< "$robots"; then
                echo "::error::Missing HTTP noindex on $route"
                failures=$((failures+1))
              fi
            fi
            if [[ "$route" == "/" ]] && ! grep -qi 'RedClause' "$body"; then
              echo "::error::Homepage does not contain RedClause"; failures=$((failures+1))
            fi
            rm -f "$headers" "$body"
          done
          echo "HTTP/SEO smoke failures: $failures"
          test "$failures" -eq 0

  shopes-preview-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Shopes Worker routes, noindex, and protected audit
        shell: bash
        run: |
          set -euo pipefail
          base="https://shopes-migration-preview.egreegregio.workers.dev"
          failures=0
          for route in "/" "/blog" "/keyword-research" "/audit" "/login" "/api/health" "/sitemap.xml"; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sSL --max-time 25 -D "$headers" -o "$body" -w '%{http_code}' "$base$route" || echo 000)"
            type="$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' || true)"
            robots="$(grep -i '^x-robots-tag:' "$headers" | tail -1 | tr -d '\r' || true)"
            echo "$route -> HTTP $code, $type, $robots"
            if [[ "$code" != "200" ]]; then
              echo "::error::HTTP $code on $route"
              head -c 500 "$body"; echo
              failures=$((failures+1))
            fi
            if [[ "$type" == *"text/html"* ]] && ! grep -qis 'noindex' <<< "$robots"; then
              echo "::error::Missing HTTP noindex on $route"
              failures=$((failures+1))
            fi
            rm -f "$headers" "$body"
          done
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl -sS --max-time 25 -X POST -H 'Content-Type: application/json' -d '{"url":"https://example.com"}' -D "$headers" -o "$body" -w '%{http_code}' "$base/api/audit" || echo 000)"
          echo "/api/audit POST -> HTTP $code (must require sign-in with 401)"
          if [[ "$code" != "401" ]] || ! grep -q 'Sign in to run a technical audit' "$body"; then
            echo "::error::Preview audit authentication gate is missing"; failures=$((failures+1))
          fi
          rm -f "$headers" "$body"
          code="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "$base/api/auth/providers" || echo 000)"
          echo "/api/auth/providers -> HTTP $code (informational; preview OAuth secrets not configured)"
          echo "Shopes live smoke failures: $failures"
          test "$failures" -eq 0

  redclause-deep-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify dynamic articles, pagination, search and 404
        shell: bash
        run: |
          set -euo pipefail
          base="https://redclause-migration-preview.egreegregio.workers.dev"
          failures=0
          for path in "/blog/how-to-start-making-music-at-home" "/blog?page=2" "/blog?q=music" "/blog?q=nonexistent987654321"; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sSL --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$base$path" || echo 000)"
            robot="$(grep -i '^x-robots-tag:' "$headers" | tail -1 | tr -d '\r' || true)"
            echo "$path -> HTTP $code | $robot | bytes $(wc -c < "$body")"
            if [[ "$code" != "200" ]] || ! grep -qi 'noindex' <<< "$robot"; then
              echo "::error::Article/listing request failed: $path"
              head -c 600 "$body"; echo
              failures=$((failures+1))
            fi
            if [[ "$path" == "/blog/how-to-start-making-music-at-home" ]] && ! grep -qi 'How to Start Making Music at Home' "$body"; then
              echo "::error::Article body or title missing"; failures=$((failures+1))
            fi
            rm -f "$headers" "$body"
          done
          headers="$(mktemp)"
          code="$(curl -sS --max-time 20 -D "$headers" -o /dev/null -w '%{http_code}' "$base/__cloudflare_preview_should_404_9345" || echo 000)"
          location="$(grep -i '^location:' "$headers" | tail -1 | tr -d '\r' || true)"
          echo "Unknown route -> HTTP $code $location (existing app redirects to /blog)"
          if [[ "$code" != "308" ]] || [[ "$location" != *"/blog"* ]]; then failures=$((failures+1)); fi
          rm -f "$headers"
          echo "RedClause deep smoke failures: $failures"
          test "$failures" -eq 0

  redclause-production-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify Production Worker candidate without domain cutover
        shell: bash
        run: |
          set -euo pipefail
          candidate="https://redclause.egreegregio.workers.dev"
          origin="https://redclause.com"
          failures=0
          for route in "/" "/blog" "/blog?page=2" "/blog?q=music" "/blog/how-to-start-making-music-at-home" "/music" "/sitemap.xml" "/robots.txt" "/treaty/RC-2026-000001?holder=ProductionCandidate&matter=Testing" "/treaty/RC-2026-000001/opengraph-image" "/ogimage.png"; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sSL --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$candidate$route" || echo 000)"
            robots="$(grep -i '^x-robots-tag:' "$headers" | tail -1 | tr -d '\r' || true)"
            type="$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' || true)"
            echo "CANDIDATE $route -> HTTP $code | $type | $robots"
            if [[ "$code" != "200" ]]; then
              echo "::error::Production candidate $route HTTP $code"; head -c 200 "$body"; echo
              failures=$((failures+1))
            fi
            if grep -qi 'noindex' <<< "$robots"; then
              echo "::error::Production candidate inadvertently has noindex on $route"
              failures=$((failures+1))
            fi
            if [[ "$route" == "/" || "$route" == "/blog" ]]; then
              if ! grep -qi '<title>' "$body"; then
                echo "::error::Candidate page missing HTML title"; failures=$((failures+1))
              fi
            fi
            rm -f "$headers" "$body"
          done
          headers="$(mktemp)"
          code="$(curl -sS --max-time 20 -D "$headers" -o /dev/null -w '%{http_code}' "$candidate/__cloudflare_prod_candidate_nonexistent_9372" || echo 000)"
          location="$(grep -i '^location:' "$headers" | tail -1 | tr -d '\r' || true)"
          echo "Unknown route -> HTTP $code | $location (expect 308 /blog)"
          if [[ "$code" != "308" ]] || [[ "$location" != *"/blog"* ]]; then failures=$((failures+1)); fi
          rm -f "$headers"
          for route in "/" "/blog" "/music" "/sitemap.xml" "/robots.txt"; do
            code="$(curl -sSL --max-time 30 -o /dev/null -w '%{http_code}' "$origin$route" || echo 000)"
            echo "HETZNER $route -> HTTP $code"
            if [[ "$code" != "200" ]]; then echo "::error::Origin failed on $route"; failures=$((failures+1)); fi
          done
          echo "Candidate vs origin failures: $failures"
          test "$failures" -eq 0
