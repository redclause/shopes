name: Backlink Catalog Audit (10-site batch)

on:
  workflow_dispatch:
  push:
    branches:
      - backlink-audit-batch-10

permissions:
  contents: read

concurrency:
  group: backlink-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit up to 10 catalog entries
        run: npm run backlink:audit -- --limit 10 --state backlink-audit-results.json
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backlink-audit-batch-10
          path: backlink-audit-results.json
          if-no-files-found: warn
          retention-days: 14
