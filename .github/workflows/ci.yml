name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Keyword engine tests
        run: npm run test:keyword-engine
      - name: Product Intelligence tests
        run: npm run test:product-intelligence
      - name: Locale and translation tests
        run: npm run test:i18n
      - name: Blog generator tests
        run: npm run test:blog
      - name: Backlink verification tests
        run: npm run test:backlink-verification
      - name: Backlink submission analysis tests
        run: npm run test:backlink-submission-analysis
      - name: Public URL safety tests
        run: npm run test:public-url
      - name: Backlink local tracker tests
        run: npm run test:backlink-tracker
      - name: Backlink audit stage-summary tests
        run: npm run test:backlink-audit-summary
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Smoke-test built production server
        run: |
          npm run start > /tmp/shopes-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-production-routes.mjs http://127.0.0.1:3000
