name: Feature QA
on:
  push:
    branches: ["feature/audit-keyword-dashboard"]
  pull_request:
    branches: ["main"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Keyword engine tests
        run: npm run test:keyword-engine
      - name: Locale and translation tests
        run: npm run test:i18n
      - name: Blog generator tests
        run: npm run test:blog
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
