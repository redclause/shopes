name: RedClause Cloudflare cutover gate

on:
  push:
    branches: [migration/cloudflare-vinext-preflight]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify real domain WWW redirect and candidate concurrency
        shell: bash
        run: |
          set -euo pipefail
          echo "Existing Hetzner WWW response:"
          curl -sS -I --max-time 20 https://www.redclause.com/ | grep -iE '^(HTTP/|location:|server:)' | tr -d '\r' || true
          echo "Cloudflare production candidate:"
          for route in / /blog /music /robots.txt /sitemap.xml; do
            code="$(curl -sS -L --max-time 25 -o /dev/null -w '%{http_code}' "https://redclause.egreegregio.workers.dev$route" || echo 000)"
            echo "$route -> $code"
            [[ "$code" == "200" ]]
          done
          echo "Moderate concurrent dynamic-route test: 24 requests, at most 4 in flight"
          tmp="$(mktemp -d)"
          export tmp
          seq 1 24 | xargs -P 4 -I '{}' bash -c '
            n="{}"
            case $((n % 4)) in
              0) route="/blog";;
              1) route="/blog?page=2";;
              2) route="/blog?q=music";;
              3) route="/blog/how-to-start-making-music-at-home";;
            esac
            code="$(curl -sS -L --max-time 25 -o /dev/null -w "%{http_code}" "https://redclause.egreegregio.workers.dev$route" || echo 000)"
            printf "%s %s %s\n" "$n" "$code" "$route" > "$tmp/$n.txt"
          '
          cat "$tmp"/*.txt | sort -n
          failures="$(awk '$2 != 200 { c++ } END { print c+0 }' "$tmp"/*.txt)"
          echo "Concurrent failures: $failures"
          test "$failures" -eq 0

  redclause-live-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live redclause.com after Workers routing
        shell: bash
        run: |
          set -euo pipefail
          base="https://redclause.com"
          failures=0
          for route in "/" "/blog" "/blog?page=2" "/blog?q=music" "/blog/how-to-start-making-music-at-home" "/music" "/sitemap.xml" "/robots.txt" "/treaty/RC-2026-000001?holder=CloudflareLive&matter=Verification" "/treaty/RC-2026-000001/opengraph-image" "/ogimage.png"; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS -L --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$base$route" || echo 000)"
            type="$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' || true)"
            robots="$(grep -i '^x-robots-tag:' "$headers" | tail -1 | tr -d '\r' || true)"
            ray="$(grep -i '^cf-ray:' "$headers" | tail -1 | tr -d '\r' || true)"
            echo "LIVE $route -> HTTP $code | $type | $robots | $ray"
            if [[ "$code" != "200" ]]; then
              echo "::error::Live domain failed $route $code"; head -c 500 "$body"; echo
              failures=$((failures+1))
            fi
            if grep -qi 'noindex' <<< "$robots"; then
              echo "::error::Indexable production route carries noindex $route";failures=$((failures+1))
            fi
            if [[ -z "$ray" ]]; then echo "::error::Not routed through Cloudflare $route";failures=$((failures+1));fi
            rm -f "$headers" "$body"
          done
          headers="$(mktemp)"
          code="$(curl -sS --max-time 20 -D "$headers" -o /dev/null -w '%{http_code}' "$base/__redclause_nonexistent_cutover_6829" || echo 000)"
          location="$(grep -i '^location:' "$headers" | tail -1 | tr -d '\r' || true)"
          echo "Unknown route -> HTTP $code $location"
          if [[ "$code" != "308" ]] || [[ "$location" != *"/blog"* ]]; then failures=$((failures+1));fi
          rm -f "$headers"
          echo "Live production failures: $failures"
          test "$failures" -eq 0

  redclause-www:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTTPS WWW Worker route and canonical metadata
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for host in redclause.com www.redclause.com; do
            for path in "/" "/blog" "/music" "/robots.txt" "/sitemap.xml" "/blog/how-to-start-making-music-at-home"; do
              headers="$(mktemp)"
              body="$(mktemp)"
              code="$(curl -sS -L --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "https://$host$path" || echo 000)"
              ray="$(grep -i '^cf-ray:' "$headers" | tail -1 | tr -d '\r' || true)"
              robots="$(grep -i '^x-robots-tag:' "$headers" | tail -1 | tr -d '\r' || true)"
              echo "$host$path -> HTTP $code | $ray | $robots"
              [[ "$code" == 200 ]] || failures=$((failures+1))
              [[ -n "$ray" ]] || failures=$((failures+1))
              if grep -qi noindex <<< "$robots"; then failures=$((failures+1)); fi
              if [[ "$path" == "/blog" ]] && ! grep -q 'https://redclause.com/blog' "$body"; then
                echo "::error::Blog canonical/reference missing on $host"
                failures=$((failures+1))
              fi
              rm -f "$headers" "$body"
            done
          done
          echo "WWW and apex failures: $failures"
          test "$failures" -eq 0
